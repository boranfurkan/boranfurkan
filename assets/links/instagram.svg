<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 74" width="211" height="74" role="img" aria-label="Instagram"><title>Instagram</title><style>@font-face{font-family:'ss';src:url(data:font/woff2;base64,) format('woff2')}.f-ss{font-family:'ss'}text{font-kerning:normal}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-18deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fly{transform-box:fill-box;transform-origin:center;animation:fly 1s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes fly{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6)}to{opacity:1;transform:none}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1.4deg)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.draw{animation:draw 1.1s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
