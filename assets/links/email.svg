.fade{animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fly{transform-box:fill-box;transform-origin:center;animation:fly 1s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes fly{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6)}to{opacity:1;transform:none}}
